<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TruthLens — Splash</title>
<style>
  html, body { margin:0; height:100%; background:#090d13; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #lockup {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    opacity:0; transition:opacity 1.1s ease; pointer-events:none;
    font-family: "Liberation Sans", "Inter", system-ui, sans-serif; text-align:center;
  }
  #lockup.on { opacity:1; }
  .ring {
    width:150px; height:150px; border-radius:50%;
    border:9px solid #4cc9f0; position:relative; margin-bottom:10px;
  }
  .ring::before {
    content:""; position:absolute; inset:34px; border-radius:50%;
    border:6px solid #e8eef4;
  }
  .ring::after {
    content:""; position:absolute; left:50%; top:50%; width:26px; height:26px;
    margin:-13px 0 0 -13px; border-radius:50%; background:#4cc9f0;
  }
  h1 { margin:0; color:#e8eef4; font-size:64px; letter-spacing:.14em; font-weight:700; }
  .sub { color:#aabecd; font-size:19px; letter-spacing:.42em; }
  .tag { color:#4cc9f0; font-size:17px; font-style:italic; }
  #hint {
    position:absolute; bottom:22px; width:100%; text-align:center;
    color:#5b7186; font:13px system-ui, sans-serif; letter-spacing:.08em;
  }
  @media (prefers-reduced-motion: reduce) {
    #lockup { transition:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="lockup">
    <div class="ring"></div>
    <h1>TRUTHLENS</h1>
    <div class="sub">INDICE DE TENSION VIDÉO</div>
    <div class="tag">Mesuré, jamais deviné.</div>
  </div>
  <div id="hint">CLIQUER POUR PASSER</div>
</div>
<script>
(() => {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const lockup = document.getElementById("lockup");
  let W, H, parts = [], ambient = [], start = performance.now(), done = false;
  const CYAN = [76, 201, 240], WHITE = [232, 238, 244], AMBER = [255, 183, 3];

  function targets() {
    // Forme cible : anneau-lentille + iris + wordmark, échantillonnés sur un masque
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const o = off.getContext("2d");
    const cx = W / 2, cy = H * 0.37, R = Math.min(W, H) * 0.135;
    o.strokeStyle = "#fff"; o.lineWidth = R * 0.17;
    o.beginPath(); o.arc(cx, cy, R, 0, Math.PI * 2); o.stroke();
    o.lineWidth = R * 0.10;
    o.beginPath(); o.arc(cx, cy, R * 0.41, 0, Math.PI * 2); o.stroke();
    o.fillStyle = "#fff";
    o.font = `700 ${Math.min(W * 0.072, 138)}px "Liberation Sans", system-ui, sans-serif`;
    o.textAlign = "center";
    o.fillText("TRUTHLENS", cx, H * 0.37 + R + Math.min(W * 0.11, 190));
    const data = o.getImageData(0, 0, W, H).data, pts = [], step = 5;
    for (let y = 0; y < H; y += step)
      for (let x = 0; x < W; x += step)
        if (data[(y * W + x) * 4 + 3] > 0) pts.push([x, y]);
    return pts;
  }

  function build() {
    W = cv.width = innerWidth * devicePixelRatio;
    H = cv.height = innerHeight * devicePixelRatio;
    const pts = targets();
    for (let i = pts.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
    const N = Math.min(2400, pts.length);
    parts = Array.from({ length: N }, (_, i) => ({
      sx: Math.random() * W, sy: Math.random() * H,
      tx: pts[i][0], ty: pts[i][1],
      delay: Math.random() * 0.55,
      size: (1.6 + Math.random() * 2) * devicePixelRatio,
      col: Math.random() < 0.72 ? CYAN : (Math.random() < 0.8 ? WHITE : AMBER),
      ph: Math.random() * Math.PI * 2,
    }));
    ambient = Array.from({ length: 140 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      s: (0.8 + Math.random()) * devicePixelRatio, ph: Math.random() * Math.PI * 2,
    }));
  }

  const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function frame(now) {
    const t = (now - start) / 1000;
    ctx.fillStyle = "#090d13"; ctx.fillRect(0, 0, W, H);
    for (const a of ambient) {
      const tw = 0.5 + 0.5 * Math.sin(t * 0.9 + a.ph);
      ctx.fillStyle = `rgba(90,130,160,${0.12 + 0.25 * tw})`;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.s, 0, Math.PI * 2); ctx.fill();
    }
    const prog = reduced ? 1 : Math.min(1, Math.max(0, (t - 0.4) / 3.2));
    // impulsion à la complétion
    const cx = W / 2, cy = H * 0.37, R = Math.min(W, H) * 0.135;
    if (!reduced && t > 3.6 && t < 4.4) {
      const pr = (t - 3.6) / 0.8, rr = R + pr * R * 1.3;
      ctx.strokeStyle = `rgba(76,201,240,${0.6 * (1 - pr)})`;
      ctx.lineWidth = 4 * devicePixelRatio;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    }
    const fade = Math.min(1, Math.max(0, (t - 4.2) / 1.1));
    if (fade > 0) lockup.classList.add("on");
    const alpha = 1 - 0.72 * fade;
    for (const p of parts) {
      const lt = Math.min(1, Math.max(0, (prog - p.delay) / Math.max(0.05, 1 - p.delay)));
      const e = easeOutExpo(lt);
      let x = p.sx + (p.tx - p.sx) * e, y = p.sy + (p.ty - p.sy) * e;
      if (lt >= 1) { x += Math.sin(t * 1.4 + p.ph) * 1.1; y += Math.cos(t * 1.2 + p.ph) * 1.1; }
      ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${0.92 * alpha})`;
      ctx.beginPath(); ctx.arc(x, y, p.size / 2, 0, Math.PI * 2); ctx.fill();
    }
    if (t < 6.2 && !done) requestAnimationFrame(frame);
  }

  addEventListener("resize", build);
  build();
  requestAnimationFrame(frame);
  const skip = () => { done = true; lockup.classList.add("on"); ctx.clearRect(0, 0, W, H); };
  addEventListener("click", skip);
  addEventListener("keydown", (e) => { if (e.key === "Escape") skip(); });
})();
</script>
</body>
</html>
